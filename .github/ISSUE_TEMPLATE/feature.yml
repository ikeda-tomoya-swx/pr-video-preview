name: 機能要望
description: 新機能の提案・要望
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        機能要望を記入してください。

  - type: textarea
    id: description
    attributes:
      label: 概要
      description: 実装したい機能の概要
      placeholder: どのような機能を追加したいですか？
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: 背景・動機
      description: なぜこの機能が必要ですか？
      placeholder: 現状の課題や、この機能で解決したいこと

  - type: textarea
    id: test_cases
    attributes:
      label: テストケース
      description: |
        E2Eテストで確認すべき操作手順を記載してください。
        OpenCodeがこの内容を読み取り、agent-browserで自動テストを実行します。
      placeholder: |
        1. ログインページにアクセス
        2. ユーザー名とパスワードを入力
        3. ログインボタンをクリック
        4. カウンター画面が表示されることを確認
        5. +ボタンをクリックしてカウントが増えることを確認
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 補足情報
      description: その他の情報（スクリーンショット、参考リンクなど）
